name: Build DASE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests (CommandParser, ConfirmationManager)
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASE-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DASE-unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      # Workflow artifact (yuqorida) 90 kundan keyin avtomatik o'chiriladi
      # va yuklab olish uchun GitHub'ga kirgan (login qilingan) bo'lish
      # kerak. Shu sababli, boshqa repo'dagi "Eng so'nggi build" kabi
      # doim ochiq, muddatsiz yuklab olinadigan APK uchun alohida
      # GitHub Release yaratamiz va shu yerga APK'ni biriktiramiz.
      - name: Publish/update "Eng so'nggi build" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Eng so'nggi build" \
            --notes "Avtomatik build. Commit: ${{ github.sha }}" \
            --prerelease
